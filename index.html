<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Us Together 🩷</title>

        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght=500;700;800&display=swap');

        :root {
            --bg-main: #fff5f5;
            --glass: rgba(255, 255, 255, 0.88);
            --accent-pink: #f472b6;
            --text-dark: #334155;
            
            --c1: #fbcfe8; --c2: #f9a8d4; --c3: #f472b6; 
            --c4: #ec4899; --c5: #db2777; --c6: #be185d;
            --c7: #fda4af; --c8: #f43f5e; --c9: #fb7185; --c10: #f472b6;
            --c-rand: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-main);
            background-image: radial-gradient(at 0% 0%, #ffe4e6 0, transparent 50%), radial-gradient(at 50% 0%, #fce7f3 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 2rem 1.5rem;
            border-radius: 45px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(251, 113, 133, 0.12);
            text-align: center;
        }

        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 5px; color: #4c0519; }
        .subtitle { font-size: 0.85rem; opacity: 0.7; margin-bottom: 2rem; font-weight: 600; color: #881337; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cat-item:active { transform: scale(0.9); }

        .icon-box {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 8px 15px rgba(244, 114, 182, 0.15);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .cat-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: #9d174d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-random {
            grid-column: span 3;
            background: var(--c-rand);
            color: white;
            padding: 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.25);
            margin-top: 10px;
        }

        #game-screen { display: none; }

        .vibe-tag {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-pink);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .roll-circle {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.1);
        }

        .shaking { animation: fastShake 0.4s infinite alternate; }
        @keyframes fastShake {
            from { transform: rotate(-10deg) scale(1.1); }
            to { transform: rotate(10deg) scale(1.1); }
        }

        .question-card {
            background: white;
            padding: 30px 20px;
            border-radius: 35px;
            min-height: 180px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.6;
            color: #4c0519;
            border: 1px solid #ffe4e6;
            animation: springUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes springUp {
            from { opacity: 0; transform: translateY(40px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .btn-draw {
            width: 100%;
            padding: 18px;
            border-radius: 22px;
            border: none;
            background: var(--accent-pink);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(244, 114, 182, 0.35);
        }

        .btn-back {
            background: transparent;
            border: none;
            color: #f472b6;
            font-weight: 700;
            font-size: 0.8rem;
            margin-top: 15px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

    let activeQueue = [];

    function start(cat) {
        let pool = [];
        let title = "";
        
        if (cat === 'random') {
            Object.values(questions).forEach(list => pool.push(...list));
            title = "🎲 Random Mix";
        } else {
            pool = [...questions[cat]];
            const names = {
                daily: "🌤️ Daily", 
                feeling: "🫶 Feeling", 
                pov: "🧠 POV", 
                family: "👨‍👩‍👧 Keluarga", 
                social: "🧑‍🤝‍🧑 Social", 
                care: "💛 Care", 
                playful: "😏 Playful", 
                reality: "🧠 Reality",
                funny: "🤪 Funny"
            };
            title = names[cat];
        }

        // Pengacakan murni tanpa batasan s1 & s2
        pool.sort(() => Math.random() - 0.5);

        activeQueue = pool;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('vibe-title').innerText = title;
        resetGame();
    }

    function draw() {
        if (activeQueue.length === 0) {
            alert("Udah habis vibenya! Pilih yang lain ya ✨");
            goHome(); return;
        }

        const icon = document.getElementById('roll-icon');
        const box = document.getElementById('q-box');
        const btn = document.getElementById('btn-draw');

        box.style.display = 'none';
        btn.disabled = true;
        icon.innerText = "🌀";
        icon.classList.add('shaking');

        setTimeout(() => {
            icon.classList.remove('shaking');
            icon.innerText = "📜";
            const pick = activeQueue.shift();
            box.innerText = pick;
            box.style.display = 'flex';
            btn.disabled = false;
            btn.innerText = "Lanjut Lagi ✨";
        }, 1200);
    }

    function resetGame() {
        document.getElementById('q-box').style.display = 'none';
        document.getElementById('roll-icon').innerText = "✨";
        document.getElementById('btn-draw').innerText = "Buka Gulungan";
    }

    function goHome() {
        document.getElementById('home-screen').style.display = 'block';
        document.getElementById('game-screen').style.display = 'none';
    }
</script>
